<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diagnóstico Exclusivo</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#f6f7f4;
--card:#ffffff;
--gold:#c6a86b;
--gold-2:#a8894f;
--text:#1f3d2b;
--muted:#6b7c6f;
--line:rgba(0,0,0,.08);
--shadow:0 20px 50px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:"Inter",sans-serif;
background:linear-gradient(180deg,#f8f9f6,#eef1eb);
color:var(--text);
}

.app{
max-width:760px;
margin:auto;
padding:20px;
}

.screen{display:none}
.screen.active{display:block}

h1,h2{
font-family:"Cormorant Garamond",serif;
text-align:center;
}

.btn{
width:100%;
padding:18px;
border-radius:999px;
border:none;
background:linear-gradient(135deg,var(--gold),var(--gold-2));
color:#fff;
font-weight:800;
cursor:pointer;
box-shadow:0 10px 25px rgba(198,168,107,.3);
}

.option{
width:100%;
padding:18px;
margin:12px 0;
border-radius:22px;
background:#fff;
border:1px solid var(--line);
cursor:pointer;
}

.card{
background:#fff;
padding:24px;
border-radius:26px;
margin-top:20px;
box-shadow:var(--shadow);
}

.input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:12px;
border:1px solid var(--line);
}

.blur{
filter:blur(6px);
opacity:.6;
}

.highlight{color:var(--gold)}

</style>
</head>

<body>

<div class="app">

<!-- INTRO -->
<section class="screen active" id="intro">
<h1>Qual ferida do pai está sabotando seu casamento?</h1>
<button class="btn" onclick="start()">Começar Diagnóstico</button>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
<h2 id="question"></h2>
<div id="answers"></div>
</section>

<!-- TEASER + FORM -->
<section class="screen" id="lead">

<h2>Seu diagnóstico começou a aparecer…</h2>

<div class="card">

<p><strong id="partialTitle"></strong></p>

<p class="blur" id="partialText"></p>

<p style="text-align:center;margin-top:10px">
🔒 Desbloqueie seu diagnóstico completo
</p>

<input class="input" id="name" placeholder="Seu nome">
<input class="input" id="phone" placeholder="WhatsApp">

<button class="btn" onclick="unlock()">
Ver diagnóstico completo
</button>

</div>

</section>

<!-- RESULTADO -->
<section class="screen" id="result">
<h2 id="resTitle"></h2>
<p id="resText"></p>
</section>

</div>

<script>

const questions=[
// suas perguntas mantidas
{q:"Quando seu marido tenta te elogiar...",a:[["Fico desconfortável","frio"],["Desconfio","ausente"],["Não mereço","condicional"],["Me irrito","explosivo"]]},
{q:"Quando brigam...",a:[["Me calo","frio"],["Quero ir embora","ausente"],["Resolvo tudo","condicional"],["Explodo","explosivo"]]},
{q:"Como era seu pai?",a:[["Frio","frio"],["Ausente","ausente"],["Condicional","condicional"],["Explosivo","explosivo"]]},
{q:"Que tipo de homem te atrai?",a:[["Reservado","frio"],["Independente","ausente"],["Precisa de mim","condicional"],["Intenso","explosivo"]]},
{q:"Quando está insegura...",a:[["Engulo","frio"],["Me afasto","ausente"],["Me esforço","condicional"],["Testo","explosivo"]]},
{q:"No fundo você sente que...",a:[["Preciso ser forte","frio"],["Vou me machucar","ausente"],["Preciso agradar","condicional"],["Preciso de provas","explosivo"]]},
{q:"Se ele fosse mais carinhoso...",a:[["Sem jeito","frio"],["Desconfio","ausente"],["Aliviada","condicional"],["Ansiosa","explosivo"]]}
];

const results={
frio:{title:"A Filha do Pai Frio",text:"Você não aprendeu a receber amor."},
ausente:{title:"A Filha do Pai Ausente",text:"Você teme abandono."},
condicional:{title:"A Filha do Pai Condicional",text:"Você acredita que precisa merecer amor."},
explosivo:{title:"A Filha do Pai Explosivo",text:"Você vive em alerta emocional."}
};

let step=0;
let score={frio:0,ausente:0,condicional:0,explosivo:0};
let winner="";

function start(){
switchScreen("intro","quiz");
render();
}

function render(){
let q=questions[step];
document.getElementById("question").innerText=q.q;

let html="";
q.a.forEach(o=>{
html+=`<button class="option" onclick="select('${o[1]}')">${o[0]}</button>`;
});
document.getElementById("answers").innerHTML=html;
}

function select(type){
score[type]++;
step++;

if(step<questions.length){
render();
}else{
finish();
}
}

function finish(){

winner=Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);

document.getElementById("partialTitle").innerText=results[winner].title;
document.getElementById("partialText").innerText=results[winner].text;

switchScreen("quiz","lead");
}

function unlock(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

if(!name || phone.length<10){
alert("Preencha corretamente");
return;
}

fetch("https://docs.google.com/forms/d/e/1FAIpQLScRK4CW6F7nm7mfoJNlpMa_S7pCw5Q5K4tvjO1OV0tqTJNItw/formResponse",{
method:"POST",
mode:"no-cors",
body:new URLSearchParams({
"entry.282931895":name,
"entry.1799475566":phone
})
});

document.getElementById("resTitle").innerText=results[winner].title;
document.getElementById("resText").innerText=results[winner].text;

switchScreen("lead","result");
}

function switchScreen(from,to){
document.getElementById(from).classList.remove("active");
document.getElementById(to).classList.add("active");
}

</script>

</body>
</html>
