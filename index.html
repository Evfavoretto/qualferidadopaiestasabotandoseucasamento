<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diagnóstico Exclusivo</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --card:#f9f9f9;
      --gold:#d4af37;
      --text:#14532d;
      --muted:#4e7d57;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Inter", sans-serif;
    }

    .app{
      max-width:760px;
      margin:auto;
      padding:20px;
    }

    .screen{display:none;}
    .screen.active{display:block;}

    h1,h2{
      font-family:"Cormorant Garamond", serif;
      text-align:center;
    }

    .btn{
      width:100%;
      padding:18px;
      border-radius:40px;
      border:none;
      background:var(--gold);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .option{
      width:100%;
      padding:18px;
      margin:10px 0;
      background:#fff;
      border:1px solid #e0e0e0;
      color:var(--text);
      border-radius:20px;
      cursor:pointer;
    }

    .card{
      background:var(--card);
      padding:20px;
      border-radius:20px;
      margin-top:20px;
      border:1px solid #e5e5e5;
    }

    .input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="app">

<!-- INTRO -->
<section class="screen active" id="introScreen">
  <h1>Qual ferida do pai está sabotando seu casamento?</h1>
  <p style="text-align:center">Responda 7 perguntas e descubra o padrão invisível que afeta sua forma de amar.</p>
  <button class="btn" id="startBtn">Começar Diagnóstico</button>
</section>

<!-- QUIZ -->
<section class="screen" id="quizScreen">
  <h2 id="questionTitle"></h2>
  <div id="optionsContainer"></div>
</section>

<!-- FORM FINAL -->
<section class="screen" id="leadScreen">

  <h2>Seu resultado está pronto 👇</h2>

  <div class="card">
    <input class="input" id="finalName" placeholder="Seu nome">
    <input class="input" id="finalWhatsapp" placeholder="(00) 00000-0000">

    <button class="btn" id="finalBtn">
      Ver meu resultado
    </button>
  </div>

</section>

<!-- RESULTADO -->
<section class="screen" id="resultScreen">
  <h2 id="resultTitle"></h2>
  <p id="resultText"></p>
</section>

</div>

<script>

const questions = [
{
title:"Quando seu marido tenta te elogiar...",
options:[
["Fico desconfortável","frio"],
["Desconfio","ausente"],
["Não mereço","condicional"],
["Me irrito","explosivo"]
]
},
{
title:"Quando vocês brigam...",
options:[
["Me calo","frio"],
["Quero ir embora","ausente"],
["Resolvo tudo","condicional"],
["Explodo","explosivo"]
]
},
{
title:"Como era a relação com seu pai?",
options:[
["Frio","frio"],
["Ausente","ausente"],
["Condicional","condicional"],
["Explosivo","explosivo"]
]
},
{
title:"Que tipo de homem te atrai?",
options:[
["Reservado","frio"],
["Independente","ausente"],
["Precisa de mim","condicional"],
["Intenso","explosivo"]
]
},
{
title:"Quando você se sente insegura...",
options:[
["Engulo","frio"],
["Me afasto","ausente"],
["Me esforço","condicional"],
["Testo ele","explosivo"]
]
},
{
title:"No fundo você sente que...",
options:[
["Preciso ser forte","frio"],
["Vou me machucar","ausente"],
["Preciso agradar","condicional"],
["Preciso de provas","explosivo"]
]
},
{
title:"Se ele fosse mais carinhoso...",
options:[
["Ficaria sem jeito","frio"],
["Desconfiaria","ausente"],
["Aliviada","condicional"],
["Ansiosa","explosivo"]
]
}
];

const results = {
frio:"A Filha do Pai Frio",
ausente:"A Filha do Pai Ausente",
condicional:"A Filha do Pai Condicional",
explosivo:"A Filha do Pai Explosivo"
};

let step=0;
let score={frio:0,ausente:0,condicional:0,explosivo:0};

const introScreen = document.getElementById("introScreen");
const quizScreen = document.getElementById("quizScreen");
const leadScreen = document.getElementById("leadScreen");
const resultScreen = document.getElementById("resultScreen");

document.getElementById("startBtn").onclick = () => {
  introScreen.classList.remove("active");
  quizScreen.classList.add("active");
  render();
};

function render(){
  let q = questions[step];
  document.getElementById("questionTitle").innerText = q.title;

  let html="";
  q.options.forEach(o=>{
    html+=`<button class="option" onclick="select('${o[1]}')">${o[0]}</button>`;
  });

  document.getElementById("optionsContainer").innerHTML = html;
}

function select(type){
  score[type]++;
  step++;

  if(step < questions.length){
    render();
  }else{
    quizScreen.classList.remove("active");
    leadScreen.classList.add("active");
  }
}

document.getElementById("finalBtn").onclick = () => {

  let name = document.getElementById("finalName").value;
  let phone = document.getElementById("finalWhatsapp").value;

  if(!name || phone.length < 10){
    alert("Preencha corretamente");
    return;
  }

  fetch("https://docs.google.com/forms/d/e/1FAIpQLScRK4CW6F7nm7mfoJNlpMa_S7pCw5Q5K4tvjO1OV0tqTJNItw/formResponse",{
    method:"POST",
    mode:"no-cors",
    body:new URLSearchParams({
      "entry.282931895":name,
      "entry.1799475566":phone
    })
  });

  let winner = Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);

  document.getElementById("resultTitle").innerText = results[winner];

  leadScreen.classList.remove("active");
  resultScreen.classList.add("active");
};

</script>

</body>
</html>
