<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diagnóstico Exclusivo</title>

<style>
/* MANTIVE SEU CSS ORIGINAL (RESUMIDO AQUI) */
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(180deg,#03100a,#0a2a1d);
  color:#fff;
}

.screen{display:none;padding:20px}
.screen.active{display:block}

.btn{
  padding:16px;
  border:none;
  background:#d0ae7e;
  width:100%;
  border-radius:999px;
  margin-top:10px;
}

.input{
  width:100%;
  padding:14px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- INTRO -->
<section class="screen active" id="introScreen">
  <h1>Qual ferida do pai está sabotando seu casamento?</h1>
  <button class="btn" id="startBtn">Começar</button>
</section>

<!-- QUIZ -->
<section class="screen" id="quizScreen">
  <h2 id="questionTitle"></h2>
  <div id="options"></div>
</section>

<!-- 🔥 NOVA TELA DE CAPTURA -->
<section class="screen" id="leadScreen">
  <h2>Antes de ver seu resultado</h2>
  <p>Preencha seus dados para liberar o diagnóstico</p>

  <input class="input" id="leadName" placeholder="Seu nome">
  <input class="input" id="leadWhatsapp" placeholder="Seu WhatsApp">

  <button class="btn" id="seeResultBtn">Ver meu resultado</button>
</section>

<!-- RESULTADO -->
<section class="screen" id="resultScreen">
  <h2 id="resultTitle"></h2>
  <p id="resultText"></p>
</section>

<script>

const questions=[
  {
    title:"Quando ele demonstra carinho?",
    options:["Desconforto","Desconfiança","Aceito","Irrito"]
  },
  {
    title:"Quando brigam?",
    options:["Me calo","Quero sair","Resolvo","Explodo"]
  }
];

const results={
  0:"Pai Frio",
  1:"Pai Ausente",
  2:"Pai Condicional",
  3:"Pai Explosivo"
};

let current=0;
let answers=[];

/* TELAS */
const intro=document.getElementById("introScreen");
const quiz=document.getElementById("quizScreen");
const lead=document.getElementById("leadScreen");
const result=document.getElementById("resultScreen");

/* START */
document.getElementById("startBtn").onclick=()=>{
  intro.classList.remove("active");
  quiz.classList.add("active");
  render();
};

/* RENDER */
function render(){
  document.getElementById("questionTitle").innerText=questions[current].title;
  const container=document.getElementById("options");
  container.innerHTML="";

  questions[current].options.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.className="btn";
    btn.innerText=opt;
    btn.onclick=()=>select(i);
    container.appendChild(btn);
  });
}

/* SELEÇÃO */
function select(i){
  answers.push(i);
  current++;

  if(current<questions.length){
    render();
  }else{
    quiz.classList.remove("active");
    lead.classList.add("active");
  }
}

/* VALIDAR E MOSTRAR RESULTADO */
document.getElementById("seeResultBtn").onclick=()=>{
  const name=document.getElementById("leadName").value.trim();
  const phone=document.getElementById("leadWhatsapp").value.trim();

  if(!name){
    alert("Digite seu nome");
    return;
  }

  if(phone.length<10){
    alert("Digite um WhatsApp válido");
    return;
  }

  lead.classList.remove("active");
  result.classList.add("active");

  const score=answers.reduce((a,b)=>a+b,0)%4;

  document.getElementById("resultTitle").innerText=results[score];
  document.getElementById("resultText").innerText="Seu diagnóstico foi gerado com base nas suas respostas.";
};

</script>

</body>
</html>
