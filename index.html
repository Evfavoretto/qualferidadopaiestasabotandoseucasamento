<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diagnóstico Exclusivo</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#f6f7f4;
--card:#ffffff;
--gold:#c6a86b;
--gold-2:#a8894f;
--text:#1f3d2b;
--muted:#6b7c6f;
--line:rgba(0,0,0,.08);
--shadow:0 20px 50px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:"Inter",sans-serif;
background:linear-gradient(180deg,#f8f9f6,#eef1eb);
color:var(--text);
}

.app{
max-width:760px;
margin:auto;
padding:20px;
}

.screen{display:none}
.screen.active{display:block}

h1,h2{
font-family:"Cormorant Garamond",serif;
text-align:center;
line-height:1.1;
}

h1{
font-size:42px;
margin-bottom:16px;
}

p{
text-align:center;
color:var(--muted);
}

.btn{
width:100%;
padding:18px;
border-radius:999px;
border:none;
background:linear-gradient(135deg,var(--gold),var(--gold-2));
color:#fff;
font-weight:800;
font-size:16px;
cursor:pointer;
box-shadow:0 10px 25px rgba(198,168,107,.3);
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.option{
width:100%;
padding:20px;
margin:12px 0;
border-radius:22px;
background:var(--card);
border:1px solid var(--line);
color:var(--text);
cursor:pointer;
box-shadow:var(--shadow);
transition:.2s;
}

.option:hover{
transform:translateY(-2px);
border-color:var(--gold);
}

.card{
background:var(--card);
padding:24px;
border-radius:26px;
margin-top:20px;
box-shadow:var(--shadow);
border:1px solid var(--line);
}

.input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:1px solid var(--line);
font-size:16px;
}

.highlight{
color:var(--gold);
font-style:italic;
}

.fade{
animation:fade .4s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

</style>
</head>

<body>

<div class="app">

<!-- INTRO -->
<section class="screen active fade" id="intro">
<h1>Qual ferida do pai<br><span class="highlight">está sabotando seu casamento?</span></h1>
<p>Responda algumas perguntas e descubra o padrão invisível que afeta sua forma de amar.</p>
<button class="btn" onclick="start()">Começar Diagnóstico</button>
</section>

<!-- QUIZ -->
<section class="screen fade" id="quiz">
<h2 id="question"></h2>
<div id="answers"></div>
</section>

<!-- CAPTURA -->
<section class="screen fade" id="lead">

<h2>Seu diagnóstico está pronto.<br><span class="highlight">Falta só um passo para acessar.</span></h2>

<div class="card">

<input class="input" id="name" placeholder="Seu nome">
<input class="input" id="phone" placeholder="WhatsApp">

<button class="btn" onclick="sendLead()">
Ver meu diagnóstico
</button>

</div>

</section>

<!-- RESULT -->
<section class="screen fade" id="result">
<h2 id="resTitle"></h2>
<p id="resText"></p>
</section>

</div>

<script>

const questions=[
{q:"Quando seu marido te elogia?",a:[
["Fico desconfortável","frio"],
["Desconfio","ausente"],
["Não mereço","condicional"],
["Me irrito","explosivo"]
]},
{q:"Quando brigam?",a:[
["Me calo","frio"],
["Quero ir embora","ausente"],
["Resolvo tudo","condicional"],
["Explodo","explosivo"]
]},
{q:"Como era seu pai?",a:[
["Frio","frio"],
["Ausente","ausente"],
["Condicional","condicional"],
["Explosivo","explosivo"]
]},
{q:"Que tipo de homem te atrai?",a:[
["Reservado","frio"],
["Independente","ausente"],
["Precisa de mim","condicional"],
["Intenso","explosivo"]
]},
{q:"Quando está insegura?",a:[
["Engulo","frio"],
["Me afasto","ausente"],
["Me esforço","condicional"],
["Testo","explosivo"]
]},
{q:"No fundo você sente que...",a:[
["Preciso ser forte","frio"],
["Vou me machucar","ausente"],
["Preciso agradar","condicional"],
["Preciso de provas","explosivo"]
]},
{q:"Se ele fosse mais carinhoso...",a:[
["Sem jeito","frio"],
["Desconfio","ausente"],
["Aliviada","condicional"],
["Ansiosa","explosivo"]
]}
];

const results={
frio:{title:"A Filha do Pai Frio",text:"Você não aprendeu a receber amor."},
ausente:{title:"A Filha do Pai Ausente",text:"Você teme abandono."},
condicional:{title:"A Filha do Pai Condicional",text:"Você acredita que precisa merecer amor."},
explosivo:{title:"A Filha do Pai Explosivo",text:"Você vive em alerta emocional."}
};

let step=0;
let score={frio:0,ausente:0,condicional:0,explosivo:0};

function start(){
switchScreen("intro","quiz");
render();
}

function render(){
let q=questions[step];
document.getElementById("question").innerText=q.q;

let html="";
q.a.forEach(o=>{
html+=`<button class="option" onclick="select('${o[1]}')">${o[0]}</button>`;
});
document.getElementById("answers").innerHTML=html;
}

function select(type){
score[type]++;
step++;

if(step<questions.length){
render();
}else{
switchScreen("quiz","lead");
}
}

function sendLead(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

if(!name || phone.length<10){
alert("Preencha corretamente");
return;
}

fetch("https://docs.google.com/forms/d/e/1FAIpQLScRK4CW6F7nm7mfoJNlpMa_S7pCw5Q5K4tvjO1OV0tqTJNItw/formResponse",{
method:"POST",
mode:"no-cors",
body:new URLSearchParams({
"entry.282931895":name,
"entry.1799475566":phone
})
});

let winner=Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);

document.getElementById("resTitle").innerText=results[winner].title;
document.getElementById("resText").innerText=results[winner].text;

switchScreen("lead","result");

}

function switchScreen(from,to){
document.getElementById(from).classList.remove("active");
document.getElementById(to).classList.add("active");
}

</script>

</body>
</html>
