<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diagnóstico Exclusivo | Qual ferida do pai está sabotando seu casamento?</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Inter;
      background:#ffffff; /* fundo branco */
      color:#14532d; /* texto verde */
    }

    .app{
      max-width:760px;
      margin:auto;
      padding:20px;
    }

    .screen{display:none;}
    .active{display:block;}

    h1,h2{
      font-family:"Cormorant Garamond";
      text-align:center;
    }

    .btn{
      width:100%;
      padding:18px;
      border-radius:40px;
      border:none;
      background:#d4af37; /* dourado */
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .option{
      width:100%;
      padding:18px;
      margin:12px 0;
      border-radius:20px;
      background:#ffffff;
      border:1px solid #ddd;
      color:#14532d;
      cursor:pointer;
    }

    .card{
      background:#f9f9f9;
      padding:20px;
      border-radius:20px;
      margin-top:20px;
      border:1px solid #e5e5e5;
    }

    .input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #ccc;
    }
  </style>
</head>

<body>

<div class="app">

<!-- INTRO -->
<section class="screen active" id="intro">
  <h1>Qual ferida do pai está sabotando seu casamento?</h1>
  <p style="text-align:center">Responda 7 perguntas e descubra o padrão invisível que afeta sua forma de amar.</p>
  <button class="btn" onclick="start()">Começar Diagnóstico</button>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <h2 id="question"></h2>
  <div id="answers"></div>
</section>

<!-- FORM (AGORA DEPOIS DO QUIZ) -->
<section class="screen" id="lead">

  <h2>Seu resultado está pronto 👇</h2>

  <div class="card">

    <input class="input" id="name" placeholder="Seu nome">
    <input class="input" id="phone" placeholder="WhatsApp">

    <button class="btn" onclick="sendLead()">
      Ver meu resultado
    </button>

  </div>

</section>

<!-- RESULTADO -->
<section class="screen" id="result">

  <h2 id="resTitle"></h2>
  <p id="resText"></p>

</section>

</div>

<script>

const questions = [
{
q:"Quando seu marido tenta te elogiar...",
a:[
["Fico desconfortável","frio"],
["Desconfio","ausente"],
["Não mereço","condicional"],
["Me irrito","explosivo"]
]
},
{
q:"Quando brigam...",
a:[
["Me calo","frio"],
["Quero ir embora","ausente"],
["Resolvo tudo","condicional"],
["Explodo","explosivo"]
]
},
{
q:"Como era seu pai?",
a:[
["Frio","frio"],
["Ausente","ausente"],
["Condicional","condicional"],
["Explosivo","explosivo"]
]
},
{
q:"Que tipo de homem te atrai?",
a:[
["Reservado","frio"],
["Independente","ausente"],
["Precisa de mim","condicional"],
["Intenso","explosivo"]
]
},
{
q:"Quando está insegura...",
a:[
["Engulo","frio"],
["Me afasto","ausente"],
["Me esforço mais","condicional"],
["Testo ele","explosivo"]
]
},
{
q:"No fundo você sente que...",
a:[
["Preciso ser forte","frio"],
["Vou me machucar","ausente"],
["Preciso agradar","condicional"],
["Preciso de provas","explosivo"]
]
},
{
q:"Se ele fosse mais carinhoso...",
a:[
["Ficaria sem jeito","frio"],
["Desconfiaria","ausente"],
["Aliviada","condicional"],
["Ansiosa","explosivo"]
]
}
];

const results = {
frio:{
title:"A Filha do Pai Frio",
text:"Você não aprendeu a receber amor."
},
ausente:{
title:"A Filha do Pai Ausente",
text:"Você teme abandono."
},
condicional:{
title:"A Filha do Pai Condicional",
text:"Você acha que precisa merecer amor."
},
explosivo:{
title:"A Filha do Pai Explosivo",
text:"Você vive em alerta emocional."
}
};

let step=0;
let score={frio:0,ausente:0,condicional:0,explosivo:0};

function start(){
document.getElementById("intro").classList.remove("active");
document.getElementById("quiz").classList.add("active");
render();
}

function render(){
let q=questions[step];
document.getElementById("question").innerText=q.q;

let html="";
q.a.forEach(o=>{
html+=`<button class="option" onclick="select('${o[1]}')">${o[0]}</button>`;
});
document.getElementById("answers").innerHTML=html;
}

function select(type){
score[type]++;
step++;

if(step<questions.length){
render();
}else{
document.getElementById("quiz").classList.remove("active");
document.getElementById("lead").classList.add("active");
}
}

function sendLead(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

if(!name || phone.length<10){
alert("Preencha corretamente");
return;
}

fetch("https://docs.google.com/forms/d/e/1FAIpQLScRK4CW6F7nm7mfoJNlpMa_S7pCw5Q5K4tvjO1OV0tqTJNItw/formResponse",{
method:"POST",
mode:"no-cors",
body:new URLSearchParams({
"entry.282931895":name,
"entry.1799475566":phone
})
});

let winner=Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);

document.getElementById("resTitle").innerText=results[winner].title;
document.getElementById("resText").innerText=results[winner].text;

document.getElementById("lead").classList.remove("active");
document.getElementById("result").classList.add("active");

}

</script>

</body>
</html>
