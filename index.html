<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diagnóstico Exclusivo | Qual ferida do pai está sabotando seu casamento?</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --bg-2:#f4f7f3;
      --card:#ffffff;
      --card-2:rgba(255,255,255,.96);

      --gold:#c6a86b;
      --gold-2:#a8894f;
      --gold-3:#e7d3a6;

      --text:#1f3d2b;
      --muted:#6b7c6f;
      --muted-2:#8fa293;

      --line:rgba(31,61,43,.12);
      --line-2:rgba(31,61,43,.22);

      --shadow:0 20px 50px rgba(0,0,0,.08);
    }

    body{
      margin:0;
      font-family:"Inter",sans-serif;
      background:linear-gradient(180deg,#ffffff,#f4f7f3);
      color:var(--text);
    }

    .app{
      max-width:760px;
      margin:auto;
      padding:20px;
    }

    .screen{display:none;}
    .screen.active{display:block;}

    .btn{
      width:100%;
      padding:18px;
      border-radius:999px;
      border:none;
      background:linear-gradient(135deg,var(--gold),var(--gold-2));
      color:#fff;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(198,168,107,.25);
    }

    .option{
      width:100%;
      padding:18px;
      margin:12px 0;
      border-radius:20px;
      background:#ffffff;
      border:1px solid var(--line);
      color:var(--text);
      cursor:pointer;
    }

    .lead-card{
      background:var(--card);
      padding:20px;
      border-radius:20px;
      margin-top:20px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }

    .input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
    }

    h1,h2{
      font-family:"Cormorant Garamond", serif;
      text-align:center;
    }

    .highlight{
      color:var(--gold);
    }
  </style>
</head>

<body>

<div class="app">

<section class="screen active" id="introScreen">
  <h1>Qual ferida do pai está sabotando seu casamento?</h1>

  <div class="lead-card">
    <input class="input" id="leadName" placeholder="Seu nome">
    <input class="input" id="leadWhatsapp" placeholder="WhatsApp">
  </div>

  <button class="btn" id="startBtn">Começar o Diagnóstico</button>
</section>

<section class="screen" id="quizScreen">
  <h2 id="questionTitle"></h2>
  <div id="optionsContainer"></div>
</section>

<section class="screen" id="resultScreen">
  <h2 id="resultTitle"></h2>
  <p id="resultText"></p>
</section>

</div>

<script>

const questions = [
{title:"Quando seu marido tenta te elogiar...",options:[
["Fico desconfortável","frio"],
["Desconfio","ausente"],
["Não mereço","condicional"],
["Me irrito","explosivo"]
]},
{title:"Quando brigam...",options:[
["Me calo","frio"],
["Quero ir embora","ausente"],
["Resolvo tudo","condicional"],
["Explodo","explosivo"]
]}
];

const results = {
frio:"A Filha do Pai Frio",
ausente:"A Filha do Pai Ausente",
condicional:"A Filha do Pai Condicional",
explosivo:"A Filha do Pai Explosivo"
};

let step=0;
let score={frio:0,ausente:0,condicional:0,explosivo:0};

const introScreen = document.getElementById("introScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

document.getElementById("startBtn").onclick = () => {
  introScreen.classList.remove("active");
  quizScreen.classList.add("active");
  render();
};

function render(){
let q=questions[step];
document.getElementById("questionTitle").innerText=q.title;

let html="";
q.options.forEach(o=>{
html+=`<button class="option" onclick="select('${o[1]}')">${o[0]}</button>`;
});
document.getElementById("optionsContainer").innerHTML=html;
}

function select(type){
score[type]++;
step++;

if(step<questions.length){
render();
}else{
showResult();
}
}

function showResult(){
let winner=Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);
document.getElementById("resultTitle").innerText=results[winner];

quizScreen.classList.remove("active");
resultScreen.classList.add("active");
}

</script>

</body>
</html>
